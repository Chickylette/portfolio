<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Classroom Arena</title>
    <link rel="stylesheet" href="common.css">
    <link rel="stylesheet" href="CAStyle.css">
</head>
<body>
    <div id="menuContainer"></div>  
   
    <script src="script.js"></script>

    <section id="Classroom Arena">
        <h2>Classroom Arena</h2>
        <p>
            This is a game focus on action combat where combat system inspired by Genshin Impact.
        </p>
        <section id="Attacks">
            <h3>Attacks</h3>
            <section id="Normal Attack">
                <h4>Normal Attack</h4>
                <figure>
                    <iframe width="560" height="315"
                    src="https://youtu.be/tdOfmzSEqRE"
                    title="YouTube video player"
                    frameborder="0"
                    allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
                    allowfullscreen>
                    <figcaption>Normal Attack Footage</figcaption>
                    </iframe>
                </figure>
            </section>

        </section>
    </section>

    <div id="footerContainer"></div>

    <script src="script.js"></script>

</body>
</html>
