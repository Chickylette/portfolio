<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Classroom Arena</title>
    <link rel="stylesheet" href="common.css">
    <link rel="stylesheet" href="CAStyle.css">
</head>
<body>
    <div id="menuContainer"></div>  
   
    <script src="script.js"></script>

    <section id="Classroom Arena">
        <h2>Classroom Arena</h2>
        <p>
            This is a game focus on action combat where combat system inspired by Genshin Impact.
        </p>
        <section id="attacks">
            <h3>Attacks</h3>
            <div class="attacks">
                <h4>Normal Attack</h4>
                <p>A four-hit normal attack combo</p>
                <figure>
                    <iframe width="560" height="315"
                    src="https://www.youtube.com/embed/tdOfmzSEqRE"
                    title="YouTube video player"
                    frameborder="0"
                    allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
                    allowfullscreen>
                    <figcaption>Normal Attack Footage</figcaption>
                    </iframe>
                </figure>
            </div>
            <div class="attacks">
                <h4>Ability</h4>
                <p>Ability</p>
                <figure>
                    <iframe width="560" height="315"
                    src="https://www.youtube.com/embed/L-KLRZsaqvA"
                    title="YouTube video player"
                    frameborder="0"
                    allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
                    allowfullscreen>
                    <figcaption>Ability Footage</figcaption>
                    </iframe>
                </figure>
            </div>
            <div class="attacks">
                <h4>Ultimate</h4>
                <p>Ultimate</p>
                <figure>
                    <iframe width="560" height="315"
                    src="https://www.youtube.com/embed/qzHI035c9x8"
                    title="YouTube video player"
                    frameborder="0"
                    allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
                    allowfullscreen>
                    <figcaption>Ultimate Footage</figcaption>
                    </iframe>
                </figure>
            </div>
        </section>
    </section>

    <div id="footerContainer"></div>

    <script src="script.js"></script>

</body>
</html>
